name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  manifestos:
    name: Validar manifestos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar -xz kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: kubeconform (schemas do Kubernetes)
        run: kubectl kustomize k8s | kubeconform -strict -summary -

      - name: shellcheck
        run: shellcheck -S warning scripts/validar.sh

  kind:
    name: Deploy no kind e validação
    runs-on: ubuntu-latest
    needs: manifestos
    steps:
      - uses: actions/checkout@v4

      - name: Criar cluster kind
        uses: helm/kind-action@v1
        with:
          cluster_name: techfleet-cluster
          config: kind-config.yaml

      - name: Validar entrega (deploy, NodePort, escala, resiliência e rollout)
        run: ./scripts/validar.sh http://localhost:30080

      - name: Estado final
        if: always()
        run: kubectl get all -n producao -o wide
